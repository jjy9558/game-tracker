<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 추적기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="design/tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 var(--fs-body)/1.5 var(--font); }
  main { max-width: 760px; margin: 0 auto; padding: var(--sp-4) var(--sp-3); }
  h1 { font-size: var(--fs-display); margin: 0 0 var(--sp-1); font-weight: 700; }
  .meta { color: var(--text-muted); font-size: var(--fs-caption); margin-bottom: var(--sp-4); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-3); margin-bottom: var(--sp-3); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--sp-3); }
  .name { font-size: var(--fs-title); font-weight: 700; margin: 0; }
  .en { color: var(--text-muted); font-size: var(--fs-caption); }
  .dday { font-size: var(--fs-title); font-weight: 700; color: var(--brand-500); white-space: nowrap; text-align: right; }
  .dday small { display: block; font-size: var(--fs-caption); font-weight: 500; color: var(--text-muted); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin: var(--sp-2) 0; }
  .chip { background: var(--chip-bg); color: var(--chip-fg); font-size: var(--fs-caption); font-weight: 500; padding: 2px 8px; border-radius: 999px; }
  .info { color: var(--text-muted); font-size: var(--fs-caption); margin: var(--sp-1) 0; }
  .warn { color: var(--text-muted); font-style: italic; }
  ul { list-style: none; padding: 0; margin: var(--sp-2) 0 0; border-top: 1px solid var(--border); }
  li { padding: var(--sp-2) 0; border-bottom: 1px solid var(--border); font-weight: 500; }
  li:last-child { border-bottom: 0; }
  li time { display: inline-block; min-width: 76px; color: var(--text-muted); font-size: var(--fs-caption); font-weight: 400; }
  a { color: var(--text); text-decoration: none; }
  a:hover { color: var(--brand-500); text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>게임 추적기</h1>
  <div class="meta" id="meta"></div>
  <div id="list">불러오는 중…</div>
</main>
<script>
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

const dday = iso => {
  if (!iso) return null;
  const days = Math.ceil((new Date(iso + 'T00:00:00') - new Date().setHours(0, 0, 0, 0)) / 86400000);
  return days === 0 ? 'D-DAY' : days > 0 ? `D-${days}` : `출시 +${-days}일`;
};

// dated games first (by date), then TBA
const sortKey = g => g.releaseDate || '9999-12-31';

function card(g) {
  const c = el('article', 'card');
  const head = el('div', 'head');
  const left = el('div');
  left.append(el('h2', 'name', g.name), el('div', 'en', g.nameEn));
  const right = el('div', 'dday');
  right.textContent = dday(g.releaseDate) ?? '미정';
  if (g.releaseDate) right.append(el('small', '', g.releaseDate));
  head.append(left, right);

  const chips = el('div', 'chips');
  [g.genre, ...g.platforms].forEach(t => chips.append(el('span', 'chip', t)));

  const info = el('div', 'info', `${g.developer} · ${g.publisher}`);
  const note = el('div', 'info' + (g.confidence === 'low' ? ' warn' : ''),
    (g.confidence === 'low' ? '⚠ ' : '') + g.releaseNote);

  const ul = el('ul');
  [...g.news].sort((a, b) => b.date.localeCompare(a.date)).forEach(n => {
    const li = el('li');
    const a = el('a', '', n.title);
    a.href = n.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    li.append(el('time', '', n.date || '—'), a);
    ul.append(li);
  });

  c.append(head, chips, info, note);
  (g.community ?? []).forEach(l => {
    const a = el('a', 'info', '💬 ' + l.title);
    a.href = l.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    c.append(a);
  });
  c.append(ul);
  return c;
}

fetch('data/games.json').then(r => r.json()).then(d => {
  document.getElementById('meta').textContent = `마지막 업데이트 ${d.updated}`;
  const list = document.getElementById('list');
  list.textContent = '';
  d.games.sort((a, b) => sortKey(a).localeCompare(sortKey(b))).forEach(g => list.append(card(g)));
}).catch(e => { document.getElementById('list').textContent = '데이터 로드 실패: ' + e.message; });
</script>
</body>
</html>
